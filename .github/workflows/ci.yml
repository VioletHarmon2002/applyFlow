
name: ApplyFlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_TEST_PASSWORD }}
          POSTGRES_DB: applyflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d applyflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q backend/app

      - name: Run API tests
        working-directory: backend
        env:
          PG_TEST_PASSWORD: ${{ secrets.POSTGRES_TEST_PASSWORD }}
        run: |
          DATABASE_URL="postgresql://admin:${PG_TEST_PASSWORD}@localhost:5432/applyflow_test" python -m pytest -v

      - name: Build Docker image
        run: docker build -t applyflow-backend ./backend
